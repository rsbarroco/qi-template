[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qi"
version = "0.1.0"
description = "Quality Intelligence — scaffold AI-assisted QA projects in seconds"
readme = "README.md"
# 3.10, not 3.11: PEP 604 (`str | None` in a typer signature, resolved at runtime) is the
# newest thing we use, and it landed in 3.10. The QA engineer's machine runs 3.10.6, and
# a floor they cannot install is a floor that keeps the eval baseline from being recorded.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "pyyaml>=6.0",
]

[project.scripts]
qi = "qi.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["qi*"]

[tool.setuptools.package-data]
qi = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/acceptance/features"
