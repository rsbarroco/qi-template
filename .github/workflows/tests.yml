name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit, script and acceptance tests
        run: python -m pytest -q --junitxml=reports/junit.xml

      - name: Eval cases must be able to fail on the untouched fixture
        run: |
          for suite in $(python -c "from tests.test_evals_suites import suites; print(' '.join(suites()))"); do
            echo "--- $suite"
            python -m evals run "$suite" --dry-run
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: reports/junit.xml
