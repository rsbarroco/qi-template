name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not an afterthought here: the eval baseline is recorded on the QA
        # engineer's machine, which is Windows. A suite that is only green on Linux says
        # nothing about the run that produces the data.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit, script and acceptance tests
        run: python -m pytest -q --junitxml=reports/junit.xml

      - name: Eval cases must be able to fail on the untouched fixture
        shell: bash
        run: |
          for suite in $(python -c "from tests.test_evals_suites import suites; print(' '.join(suites()))"); do
            echo "--- $suite"
            python -m evals run "$suite" --dry-run
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}
          path: reports/junit.xml
